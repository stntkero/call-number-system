<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國光同濟會 捐血叫號</title>
    <meta name="description" content="國光同濟會捐血活動即時叫號。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="國光同濟會 捐血叫號">
    <meta property="og:description" content="即時查看目前叫號。">
    <meta property="og:image" content="https://stntkero.github.io/call-number-system/logo.jpg">
    <meta property="og:url" content="https://stntkero.github.io/call-number-system/">
    <link rel="icon" href="logo.jpg">
    <style>
        :root {
            --primary: #007bff;
            --text: #333;
            --muted: #666;
            --soon: #e67e00;
            --warn: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* 扣掉手機瀏覽器工具列的實際高度 */
            margin: 0;
            padding: 16px clamp(24px, 7vw, 48px); /* 框框左右和螢幕邊緣保持距離 */
            box-sizing: border-box;
            background-color: #f0f2f5;
            color: var(--text);
        }

        /* --- 浮水印 --- */
        .watermark-image {
            position: fixed; /* 固定在視口，不隨捲動移動 */
            inset: 0;
            pointer-events: none; /* 讓浮水印不阻礙點擊 */
            z-index: -1;
            opacity: 0.15;
            background: url('logo.jpg') no-repeat center center / contain;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.5); /* 白色，透明度為 50% */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 1200px;
            min-height: 62vh;
            min-height: 62dvh; /* 框框撐滿大部分畫面，內容垂直置中 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .status-banner {
            background: #fff3cd;
            color: #7a5200;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 1.2em;
            font-weight: bold;
        }

        /* 文字大小跟著螢幕等比例縮放，現場的平板或電視也看得清楚 */
        .label {
            font-size: 2.2rem;
            font-size: min(10vw, 7dvh);
            color: #555;
        }

        #currentNumber {
            font-size: 10rem;
            font-size: min(48vw, 34dvh); /* 螢幕放不下時由 fitNumber() 縮小 */
            line-height: 1.2;
            font-weight: bold;
            white-space: nowrap;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            animation: pulse 1.5s infinite alternate; /* 平常輕微跳動，看起來是即時的 */
        }

        #currentNumber.loading {
            font-size: clamp(2.5rem, 14vw, 4rem);
            padding: 0.6em 0;
            animation: blink 0.8s infinite alternate;
        }

        /* 號碼變動時先閃一下，再繼續平常的跳動 */
        #currentNumber.changed {
            animation: called 1.2s ease-out, pulse 1.5s 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.05); opacity: 0.9; }
        }

        @keyframes blink {
            to { opacity: 0.4; }
        }

        @keyframes called {
            0% { transform: scale(1.25); color: var(--soon); }
            100% { transform: scale(1); color: var(--primary); }
        }

        @media (prefers-reduced-motion: reduce) {
            #currentNumber,
            #currentNumber.loading,
            #currentNumber.changed {
                animation: none;
            }
        }

        .connection {
            font-size: clamp(0.95rem, 2.6dvh, 2rem);
            color: var(--muted);
            min-height: 1.4em;
        }

        .connection.warn {
            color: var(--warn);
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            font-size: clamp(0.85rem, 1.8dvh, 1.4rem);
            color: #888;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="watermark-image"></div>

    <main class="container">
        <div id="statusBanner" class="status-banner" hidden></div>
        <div class="label">目前叫號</div>
        <div id="currentNumber" class="loading" aria-live="polite">載入中</div>
        <div id="connection" class="connection"></div>
    </main>

    <footer class="footer">
        國光同濟會 捐血活動<br>
        請以現場叫號為準
    </footer>

    <script src="config.js"></script>
    <script>
        // Apps Script 同一帳號最多同時執行約 30 個，人多時要控制更新頻率。
        // 號碼約 5～10 分鐘才前進一號，20 秒更新一次就夠
        const POLL_MS = 20000;
        const TIMEOUT_MS = 8000;
        const MAX_RETRY_MS = 60000;

        const els = {
            number: document.getElementById('currentNumber'),
            connection: document.getElementById('connection'),
            status: document.getElementById('statusBanner'),
        };

        let state = null;        // 最後一次成功取得的資料
        let lastSuccess = null;  // 最後一次成功連線的時間
        let failures = 0;
        let timer = null;
        let inFlight = false;

        function formatTime(date) {
            return date.toLocaleTimeString('zh-TW', { hour12: false });
        }

        async function poll() {
            clearTimeout(timer);
            if (document.hidden || inFlight) return;
            inFlight = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);
            try {
                const response = await fetch(API_URL, { cache: 'no-store', signal: controller.signal });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || data.number === undefined) throw new Error('資料格式不正確');
                failures = 0;
                lastSuccess = new Date();
                renderState(data);
            } catch (err) {
                failures++;
                console.error('獲取號碼失敗:', err);
            } finally {
                clearTimeout(timeout);
                inFlight = false;
                renderConnection();
                if (!document.hidden) timer = setTimeout(poll, nextDelay());
            }
        }

        function nextDelay() {
            // 連線失敗時從平常的間隔開始逐次加倍，不會比平常更頻繁，避免在 Google 忙碌時雪上加霜
            const delay = failures ? Math.min(POLL_MS * 2 ** (failures - 1), MAX_RETRY_MS) : POLL_MS;
            // 每支手機錯開 ±20%，避免大家在同一秒一起讀取
            return Math.round(delay * (0.8 + Math.random() * 0.4));
        }

        function renderState(data) {
            const previous = state;
            state = data;

            const text = data.number === '' || data.number === null ? '—' : String(data.number);
            if (els.number.textContent !== text || els.number.classList.contains('loading')) {
                els.number.textContent = text;
                els.number.classList.remove('loading', 'changed');
                fitNumber();
                if (previous) {
                    void els.number.offsetWidth; // 重新觸發動畫
                    els.number.classList.add('changed');
                }
                document.title = text + ' 號｜國光同濟會 捐血叫號';
            }

            els.status.textContent = data.status || '';
            els.status.hidden = !data.status;
        }

        // 只有螢幕太窄、數字放不下時才縮小到剛好放得下，其他時候維持最大
        function fitNumber() {
            els.number.style.fontSize = '';
            if (els.number.classList.contains('loading')) return;
            const overflow = els.number.scrollWidth / els.number.clientWidth;
            if (overflow > 1) {
                els.number.style.fontSize = Math.floor(parseFloat(getComputedStyle(els.number).fontSize) / overflow) + 'px';
            }
        }

        function renderConnection() {
            els.connection.classList.toggle('warn', failures > 0);
            if (failures === 0) {
                els.connection.textContent = '已更新 ' + formatTime(lastSuccess);
            } else if (lastSuccess) {
                els.connection.textContent = '連線不穩，重新連線中…（最後更新 ' + formatTime(lastSuccess) + '）';
            } else if (failures >= 2) {
                els.connection.textContent = '無法連線，請檢查網路，系統會自動重試';
            }
        }

        // 切到背景（切出 LINE、鎖螢幕）時暫停更新，回來時立即更新
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clearTimeout(timer);
            else poll();
        });

        window.addEventListener('resize', fitNumber); // 手機轉向時重新調整

        poll();
    </script>
</body>
</html>
